name: Project Eaden
description: 'Project Eaden (PROJECT EADEN GmbH) is a Berlin-based food-technology company
  building fiber-spinning technology to power the next generation of whole-cut plant-based
  protein. Its platform reconstructs the fibrous structure of animal muscle from plant
  ingredients to create alternatives such as plant-based fish and meat, and it collaborates
  on consumer brands including LEKKA. Backed by Creandum and co-funded through EIT Food
  and the European Union, the company operates as a consumer food-tech producer and
  currently publishes no public developer API surface.'
